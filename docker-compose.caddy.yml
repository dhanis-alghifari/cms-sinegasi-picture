services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_net
    environment:
      - CADDY_INGRESS_NETWORKS=caddy_net

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
    external: true
