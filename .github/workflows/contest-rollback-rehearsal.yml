name: Synthetic Contest Rollback Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/contest-rollback-rehearsal.yml'
      - 'scripts/rehearse-contest-null-rollback.sh'
      - 'scripts/rehearse-contest-candidate-image.cjs'
      - 'supabase/migrations/20261106145108_contest_optional_deadline.sql'

permissions: {}

concurrency:
  group: contest-rollback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Cache exact public test images
        run: |
          docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          docker pull ghcr.io/dhanis-alghifari/cms-sinegasi-picture/api@sha256:d6b998602feefc66d74d484bf5863d415a12721bbca534d7d2fa169e8326e3f4

      - name: Test synthetic schema and rollback mapper
        run: bash scripts/rehearse-contest-null-rollback.sh

      - name: Checkout pinned compatible rollback candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: bbad6c3ad219c5f30a4302df8801c1d59c048211
          path: rollback-src
          persist-credentials: false

      - name: Checkout pinned hotfix source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: 8d477ea51c7f63283068ed130c855f736810e8a7
          path: hotfix-src
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install isolated test dependencies
        run: |
          set -Eeuo pipefail
          cmp rollback-src/backend/package-lock.json hotfix-src/backend/package-lock.json
          npm ci --prefix rollback-src/backend
          npm ci --prefix rollback-src/frontend
          ln -s "$GITHUB_WORKSPACE/rollback-src/backend/node_modules" hotfix-src/backend/node_modules

      - name: Test rollback frontend and synthetic API integration
        working-directory: rollback-src
        env:
          ENV_FILE_LOADING: disabled
          ROLLBACK_HOTFIX_DIR: ${{ github.workspace }}/hotfix-src
        run: |
          node --import ./frontend/scripts/register-frontend-tsconfig.mjs --import ./backend/node_modules/tsx/dist/loader.mjs --test \
            frontend/tests/rollbackDeadlineCompatibility.test.ts frontend/tests/rollbackContestIntegration.test.ts
          npm run build --prefix frontend

      - name: Build candidate image on disposable runner only
        run: |
          docker build --label org.opencontainers.image.revision=bbad6c3ad219c5f30a4302df8801c1d59c048211 \
            --tag local/contest-rollback-candidate:bbad6c3 rollback-src/backend

      - name: Test built candidate image with synthetic data
        run: |
          docker run --rm -i --pull never --network none --restart no \
            --memory 256m --memory-swap 256m --cpus 0.5 --pids-limit 64 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e ENV_FILE_LOADING=disabled -e NODE_ENV=development \
            -e BACKGROUND_JOBS_ENABLED=false -e ALLOW_DEV_AUTH=false \
            --entrypoint node local/contest-rollback-candidate:bbad6c3 - < scripts/rehearse-contest-candidate-image.cjs

      - name: Smoke test rollback API without network or production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          container_id=""
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker stop -t 2 "$container_id" >/dev/null
            fi
          }
          trap cleanup EXIT
          for test_image in \
            ghcr.io/dhanis-alghifari/cms-sinegasi-picture/api@sha256:d6b998602feefc66d74d484bf5863d415a12721bbca534d7d2fa169e8326e3f4 \
            local/contest-rollback-candidate:bbad6c3; do
            container_id=$(docker run -d --rm --pull never --network none --restart no \
              --memory 256m --memory-swap 256m --cpus 0.5 --pids-limit 64 \
              --read-only --cap-drop ALL --security-opt no-new-privileges \
              -e ENV_FILE_LOADING=disabled -e NODE_ENV=development \
              -e BACKGROUND_JOBS_ENABLED=false -e ALLOW_DEV_AUTH=false "$test_image")
            docker exec "$container_id" node -e '
            (async () => {
              for (let attempt = 0; attempt < 30; attempt++) {
                try {
                  const health = await fetch("http://127.0.0.1:5001/api/health");
                  const protectedRoute = await fetch("http://127.0.0.1:5001/api/contests");
                  if (health.status !== 200 || protectedRoute.status !== 401) {
                    throw new Error(`Unexpected status: health=${health.status} protected=${protectedRoute.status}`);
                  }
                  console.log("ROLLBACK_API_LIVENESS_AND_UNAUTHENTICATED_DENIAL_OK");
                  return;
                } catch (error) {
                  if (attempt === 29) throw error;
                  await new Promise(resolve => setTimeout(resolve, 500));
                }
              }
            })().catch(error => { console.error(error.message); process.exit(1); });'
            docker stop -t 2 "$container_id" >/dev/null
            container_id=""
          done
