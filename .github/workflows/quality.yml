name: Code Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Verify deployment guardrails
        run: |
          node scripts/verify-guardrails.mjs
          bash -n ops/deploy-dev.sh
          node --test ops/deploy-dev.test.mjs
          DEV_TRUST_PROXY_ADDRESSES=192.0.2.10 docker compose --env-file /dev/null -f docker-compose.dev.yml config --no-env-resolution --quiet

      - name: Verify repository hygiene
        run: node --test scripts/check-repository-hygiene.test.mjs && node scripts/check-repository-hygiene.mjs

      - name: Run backend quality checks
        run: npm run quality:check
        working-directory: backend

  frontend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend tooling used by frontend checks
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend quality checks
        run: npm run quality:check
        working-directory: frontend
        env:
          CF_PAGES: '1'
          CF_PAGES_URL: https://01234567.sinegasi-picture-develop-cms.pages.dev
