name: Deploy Development Backend

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'docker-compose.dev.yml'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

jobs:
  deploy-backend-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS (Development)
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy -p 22 "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            cd /opt/sinegasi
            git fetch origin develop
            git checkout develop
            git pull origin develop
            docker compose -f docker-compose.dev.yml up -d --build --remove-orphans
            docker image prune -f
            echo "✅ Development backend deployed successfully"
          EOF
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
