name: Deploy Development Backend

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'docker-compose.dev.yml'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

jobs:
  deploy-backend-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Secret Format
        run: |
          echo "VPS_HOST set: $([ -n "$VPS_HOST" ] && echo 'YES' || echo 'NO')"
          echo "VPS_USER set: $([ -n "$VPS_USER" ] && echo 'YES' || echo 'NO')"
          echo "VPS_SSH_KEY length: ${#VPS_KEY}"
          echo "VPS_SSH_KEY lines: $(echo "$VPS_KEY" | wc -l)"
          echo "VPS_SSH_KEY header: $(echo "$VPS_KEY" | head -n 1)"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS (Development)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/sinegasi
            git fetch origin develop
            git checkout develop
            git pull origin develop
            docker compose -f docker-compose.dev.yml up -d --build --remove-orphans
            docker image prune -f
            echo "✅ Development backend deployed successfully"
