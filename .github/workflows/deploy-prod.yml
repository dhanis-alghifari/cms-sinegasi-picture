name: Build and Approve Production Backend

permissions: {}

concurrency:
  group: sinegasi-vps-deployment
  cancel-in-progress: false

# No automatic production writes on push. Dispatch only after schema/restore
# rehearsal, approved credentials, host access and exact release review.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full approved main commit SHA
        required: true
        type: string
      schema_evidence_sha256:
        description: SHA256 of fresh reviewed reconciled-no-sql deployment evidence (not a migration manifest)
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.digest_ref }}
      package_checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - name: Validate manual dispatch
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_SHA256: ${{ inputs.schema_evidence_sha256 }}
          READY: ${{ vars.PRODUCTION_DEPLOYMENT_READY }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$READY" = true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current main release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Production package guardrails and rollback rehearsal
        run: |
          node scripts/verify-guardrails.mjs
          bash -n ops/deploy-prod.sh ops/production-release.sh
          node --test ops/production-release.test.mjs

      - name: Backend quality
        working-directory: backend
        env:
          ENV_FILE_LOADING: disabled
          NODE_ENV: test
        run: |
          npm ci
          npm run quality:check
          npm audit --omit=dev --audit-level=high

      - name: Verify actual environment protection and exact successful main quality
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/production-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/production-branches.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > "$RUNNER_TEMP/current-main.json"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&event=push&status=success&head_sha=$RELEASE_SHA&per_page=20" --jq '.workflow_runs[0].id')"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/quality-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/quality-jobs.json"
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const gate = require("./backend/dist/scripts/productionDeploymentGate.js"); const read = name => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, name), "utf8")); gate.requireProductionEnvironment(read("production-environment.json"), read("production-branches.json")); gate.requireDeploymentQuality(read("quality-run.json"), read("quality-jobs.json"), process.env.RELEASE_SHA, read("current-main.json"));'

      - name: Verify reconciled schema evidence offline without applying SQL
        working-directory: backend
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_SHA256: ${{ inputs.schema_evidence_sha256 }}
          REVIEWED_EVIDENCE: ${{ vars.PRODUCTION_SCHEMA_EVIDENCE }}
        run: |
          # Preserve exact reviewed bytes; never promote the blocked numbered
          # migrations or treat this integrity check as a human signature.
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const raw = process.env.REVIEWED_EVIDENCE; if (!raw || Buffer.byteLength(raw) > 262144) process.exit(1); fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "schema-evidence.json"), raw, {flag: "wx", mode: 0o600});'
          npm run deployment:verify -- --evidence "$RUNNER_TEMP/schema-evidence.json" --confirm-evidence "$EVIDENCE_SHA256" --snapshot ../ops/production-schema.snapshot.json --release-sha "$RELEASE_SHA"

      - name: Build and publish immutable amd64 API image
        id: image
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$RELEASE_SHA" --tag "$image:$RELEASE_SHA" ./backend
          docker push "$image:$RELEASE_SHA"
          digest_ref="$(docker image inspect -f '{{index .RepoDigests 0}}' "$image:$RELEASE_SHA")"
          [[ "$digest_ref" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'Release `%s` image: `%s`\n\nA NEW deployment approval must bind this digest, release archive checksum, schema evidence, media origin and window before the deployment job is approved.\n' "$RELEASE_SHA" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Package reviewed deployment files
        id: package
        run: |
          tar -czf production-release.tar.gz docker-compose.prod.yml ops/deploy-prod.sh ops/production-release.sh ops/production-runtime-preflight.cjs ops/production-schema-preflight.cjs ops/production-schema.snapshot.json
          checksum="$(sha256sum production-release.tar.gz | cut -d ' ' -f 1)"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release
          path: production-release.tar.gz
          retention-days: 30

  deploy-backend-prod:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require completed go-live gates
        env:
          READY: ${{ vars.PRODUCTION_DEPLOYMENT_READY }}
        run: test "$READY" = true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Recheck actual production environment before SSH
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ENV_FILE_LOADING: disabled
        run: |
          set -Eeuo pipefail
          umask 077
          npm ci --ignore-scripts --prefix backend
          npm run build --prefix backend
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/production-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/production-branches.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > "$RUNNER_TEMP/current-main.json"
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const gate = require("./backend/dist/scripts/productionDeploymentGate.js"); const read = name => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, name), "utf8")); gate.requireProductionEnvironment(read("production-environment.json"), read("production-branches.json")); if (read("current-main.json").sha !== process.env.RELEASE_SHA) process.exit(1);'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-release

      - name: Deploy approved release through private pinned SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_PUBLIC_KEY: ${{ secrets.VPS_HOST_PUBLIC_KEY }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_SHA256: ${{ inputs.schema_evidence_sha256 }}
          IMAGE_DIGEST: ${{ needs.build-release.outputs.image }}
          PACKAGE_CHECKSUM: ${{ needs.build-release.outputs.package_checksum }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" == ubuntu ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PACKAGE_CHECKSUM" =~ ^[a-f0-9]{64}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$VPS_HOST_PUBLIC_KEY" == ssh-ed25519\ * && "$VPS_HOST_PUBLIC_KEY" != *$'\n'* ]]
          printf '%s  production-release.tar.gz\n' "$PACKAGE_CHECKSUM" | sha256sum --check --status
          ssh_directory="$(mktemp -d "$RUNNER_TEMP/sinegasi-prod-ssh.XXXXXX")"
          trap 'rm -f -- "$ssh_directory/id_deploy" "$ssh_directory/known_hosts"; rmdir -- "$ssh_directory"' EXIT
          if [[ "$VPS_SSH_KEY" == *BEGIN* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_directory/id_deploy"
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \r\n' | base64 -d > "$ssh_directory/id_deploy"
          fi
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_PUBLIC_KEY" > "$ssh_directory/known_hosts"
          ssh_options=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o ConnectTimeout=10 -o "UserKnownHostsFile=$ssh_directory/known_hosts" -i "$ssh_directory/id_deploy")
          # Directories, registry pull credentials and private rescue access are
          # provisioned/verified separately; this job never changes firewall.
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "test -d /opt/sinegasi-prod/incoming && test ! -e /opt/sinegasi-prod/incoming/$RELEASE_SHA.tar.gz && test -f /opt/sinegasi-prod/config/approvals/$RELEASE_SHA.txt && test -f /opt/sinegasi-prod/config/approvals/$RELEASE_SHA.schema.json && test -f /opt/sinegasi-prod/config/schema-gate.json"
          scp "${ssh_options[@]}" production-release.tar.gz "$VPS_USER@$VPS_HOST:/opt/sinegasi-prod/incoming/$RELEASE_SHA.tar.gz"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" bash -s -- "$RELEASE_SHA" "$IMAGE_DIGEST" "$EVIDENCE_SHA256" "$PACKAGE_CHECKSUM" <<'REMOTE'
            set -Eeuo pipefail
            umask 077
            test "$(id -un)" = ubuntu
            test "$(hostname)" = VM-11-154-ubuntu
            release_sha=$1 image_digest=$2 evidence_sha256=$3 package_checksum=$4
            [[ "$release_sha" =~ ^[a-f0-9]{40}$ && "$evidence_sha256" =~ ^[a-f0-9]{64}$ && "$package_checksum" =~ ^[a-f0-9]{64}$ ]]
            [[ "$image_digest" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
            test "$(stat -c '%U:%a' /opt/sinegasi-prod)" = ubuntu:700
            test "$(stat -c '%U:%a' /opt/sinegasi-prod/releases)" = ubuntu:700
            test "$(stat -c '%U:%a' /opt/sinegasi-prod/incoming)" = ubuntu:700
            test ! -L /opt/sinegasi-prod
            test ! -L /opt/sinegasi-prod/releases
            test ! -L /opt/sinegasi-prod/incoming
            package_path="/opt/sinegasi-prod/incoming/$release_sha.tar.gz"
            printf '%s  %s\n' "$package_checksum" "$package_path" | sha256sum --check --status
            release_path="/opt/sinegasi-prod/releases/$release_sha"
            mkdir -- "$release_path" # Never overwrite an existing release.
            tar -xzf "$package_path" -C "$release_path"
            cd "$release_path"
            bash ./ops/deploy-prod.sh "$release_sha" "$image_digest" "$evidence_sha256" "$package_checksum"
          REMOTE
