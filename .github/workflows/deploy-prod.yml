name: Deploy Production Backend

concurrency:
  group: sinegasi-vps-deployment
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "ops/**"
      - ".github/workflows/deploy-prod.yml"
      - "scripts/verify-guardrails.mjs"

jobs:
  # Step 1: Run quality checks before deploying
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Verify Guardrails
        run: node scripts/verify-guardrails.mjs

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Type check
        run: cd backend && npm run typecheck

      - name: Run tests
        run: cd backend && npm test

      - name: Build
        run: cd backend && npm run build

  # Step 2: Deploy only if quality checks pass
  deploy-backend-prod:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS (Production)
        run: |
          mkdir -p ~/.ssh
          if echo "$VPS_SSH_KEY" | grep -q "BEGIN"; then
            printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          else
            echo "$VPS_SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy
          fi
          echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          test -n "$VPS_HOST_PUBLIC_KEY"
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/id_deploy -p 22 "$VPS_USER@$VPS_HOST" << 'EOF'
            set -Eeuo pipefail
            test "$(id -un)" = "ubuntu"
            test "$(stat -c '%U' /opt/sinegasi)" = "ubuntu"
            cd /opt/sinegasi
            test -z "$(git status --porcelain)"
            git fetch origin main
            git checkout main
            test "$(git branch --show-current)" = "main"
            git pull --ff-only origin main
            ./ops/deploy-prod.sh
            echo "✅ Production backend deployed successfully"
          EOF
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_PUBLIC_KEY: ${{ secrets.VPS_HOST_PUBLIC_KEY }}
