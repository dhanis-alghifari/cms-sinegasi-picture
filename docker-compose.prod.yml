services:
  api-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinegasi-api-prod
    restart: unless-stopped
    ports:
      - "3002:5001"
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=true
    networks:
      - caddy_net
    labels:
      caddy: api.sinegasi.com
      caddy.reverse_proxy: "{{upstreams 5001}}"

networks:
  caddy_net:
    external: true
