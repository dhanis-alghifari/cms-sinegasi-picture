openapi: 3.1.0
info:
  title: Sinegasi CMS API
  version: 1.0.0
  description: Initial contract for the hardened routes. Expand per vertical slice.
servers:
  - url: http://localhost:5001
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is running
  /api/auth/login:
    post:
      security: []
      summary: Create a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid credentials }
        '429': { description: Login rate limit exceeded }
        '503': { description: Authentication service unavailable }
  /api/auth/me:
    get:
      summary: Return canonical session state
      responses:
        '200': { description: Current authenticated user }
        '401': { description: Unauthenticated or inactive account }
  /api/auth/logout:
    post:
      summary: End the current session
      responses:
        '200': { description: Session ended }
        '401': { description: Unauthenticated }
  /api/auth/change-password:
    post:
      summary: Change the authenticated user's password (legacy method)
      description: Kept for clients that use the original POST contract; PATCH is the preferred method for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { description: Password changed and rotated token returned }
        '400': { description: Password policy or current password failure }
        '401': { description: Invalid or revoked session }
        '503': { description: Migration or database unavailable }
    patch:
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { description: Password changed and rotated token returned }
        '400': { description: Password policy or current password failure }
        '401': { description: Invalid or revoked session }
        '503': { description: Migration or database unavailable }
  /api/dashboard/summary:
    get:
      summary: Return a role-scoped dashboard summary
      description: Teacher accounts receive operational aggregates; every other role receives only its own personal summary.
      responses:
        '200': { description: Dashboard summary returned }
        '401': { description: Unauthenticated }
        '403': { description: Dashboard capability missing }
        '503': { description: Dashboard data source unavailable }
  /api/access-control/matrix:
    get:
      summary: Read the role and capability matrix
      description: Teacher-only policy administration read endpoint. The backend remains authoritative even when the frontend hides a menu.
      responses:
        '200': { description: Role capability matrix }
        '401': { description: Unauthenticated }
        '403': { description: Access-control read capability missing }
        '503': { description: Access-control migration unavailable }
  /api/access-control/audit-logs:
    get:
      summary: Read access-policy change history
      description: Returns immutable RBAC policy changes with actor name, username, and role snapshots.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200': { description: Access-control audit records with actor snapshots }
        '401': { description: Unauthenticated }
        '403': { description: Access-control read capability missing }
        '503': { description: Access-control audit migration unavailable }
  /api/access-control/roles/{role}/capabilities:
    put:
      summary: Replace one role's capabilities
      description: Teacher-only, audited, deny-by-default policy update. The teacher role cannot remove its own access-control management capability.
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [teacher, leader, vice_leader, treasurer, secretary, equipment_team, contest_team, member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilities, change_reason]
              properties:
                capabilities:
                  type: array
                  uniqueItems: true
                  items: { type: string }
                change_reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Capability policy replaced and audit recorded }
        '401': { description: Unauthenticated }
        '403': { description: Teacher-only access-control management }
        '422': { description: Invalid role, capability list, reason, or teacher lockout }
        '503': { description: Access-control migration unavailable }
  /api/audit-logs:
    get:
      summary: List immutable audit trail entries
      description: Teacher-only, bounded audit history with deterministic pagination and optional actor/table/date filters.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 10, maximum: 100, default: 20 } }
        - { name: table_name, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: action, in: query, required: false, schema: { type: string, enum: [INSERT, UPDATE, UPSERT, DELETE, SYSTEM_CHECK] } }
        - { name: actor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: record_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: date_from, in: query, required: false, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: false, schema: { type: string, format: date } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Deterministically ordered audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - $ref: '#/components/schemas/AuditLogPage'
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '422': { description: Invalid audit filters }
        '503': { description: Audit schema or database is unavailable }
  /api/audit-logs/entry/{id}:
    get:
      summary: Read one audit entry
      description: Teacher-only lookup of one immutable audit entry by UUID.
      parameters:
        - $ref: '#/components/parameters/AuditEntryId'
      responses:
        '200':
          description: Audit entry detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/AuditLog' }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '404': { description: Audit entry not found }
        '422': { description: Invalid audit entry ID }
        '503': { description: Audit schema or database is unavailable }
  /api/audit-logs/{tableName}/{recordId}:
    get:
      summary: List audit history for a record
      description: Teacher-only, bounded history for one allowlisted table and record identifier.
      parameters:
        - name: tableName
          in: path
          required: true
          schema: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_]{0,127}$' }
        - name: recordId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 10, maximum: 100, default: 20 } }
        - { name: action, in: query, required: false, schema: { type: string, enum: [INSERT, UPDATE, UPSERT, DELETE, SYSTEM_CHECK] } }
        - { name: date_from, in: query, required: false, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Deterministically ordered record history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - $ref: '#/components/schemas/AuditLogPage'
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '422': { description: Invalid record identifiers or filters }
        '503': { description: Audit schema or database is unavailable }
  /api/admin/overdue-check:
    post:
      summary: Run the overdue borrowing check manually
      description: Leader-only trigger that reuses the scheduled worker and returns a bounded diagnostic log preview.
      responses:
        '200':
          description: Overdue check completed
          content:
            application/json:
              schema:
                type: object
                required: [success, message, result, logs]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, maxLength: 300 }
                  result: { $ref: '#/components/schemas/OverdueCheckResult' }
                  logs:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/OverdueNotificationLog' }
        '401': { description: Unauthenticated }
        '403': { description: Leader role required }
        '500': { description: Overdue check failed }
  /api/notifications/unread-count:
    get:
      summary: Count unread notifications for the authenticated user
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer, minimum: 0 }
        '401': { description: Unauthenticated }
        '503': { description: Notification schema or database identity is unavailable }
  /api/notifications:
    get:
      summary: List notifications for the authenticated user
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: is_read, in: query, required: false, schema: { type: boolean } }
        - { name: unread_only, in: query, required: false, schema: { type: boolean } }
      responses:
        '200': { description: Deterministically ordered paginated notifications and unread count }
        '401': { description: Unauthenticated }
        '503': { description: Notification schema or database identity is unavailable }
  /api/notifications/{id}/read:
    patch:
      summary: Mark one owned notification as read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Notification marked as read }
        '401': { description: Unauthenticated }
        '404': { description: Notification not found for the authenticated user }
        '503': { description: Notification schema or database identity is unavailable }
  /api/notifications/read-all:
    post:
      summary: Mark all notifications as read (legacy-compatible method)
      responses:
        '200': { description: Number of notifications marked as read is included in the message }
        '401': { description: Unauthenticated }
        '503': { description: Notification schema or database identity is unavailable }
    patch:
      summary: Mark all notifications as read
      responses:
        '200': { description: Number of notifications marked as read is included in the message }
        '401': { description: Unauthenticated }
        '503': { description: Notification schema or database identity is unavailable }
  /api/users:
    get:
      summary: List operational and member accounts
      description: Teacher-only account management list with bounded pagination and server-side search/filtering.
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [all, teacher, leader, vice_leader, treasurer, secretary, equipment_team, contest_team, member] } }
        - { name: is_active, in: query, required: false, schema: { type: string, enum: [all, 'true', 'false'] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated user accounts without password hashes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - $ref: '#/components/schemas/UserPage'
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '503': { description: Users schema (including migration 041) or database identity is unavailable }
    post:
      summary: Create an operational user account
      description: Teacher-only account creation. The temporary password is returned once and is never stored in audit logs.
      parameters:
        - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201': { description: Account created with a one-time temporary password }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '409': { description: Username already exists }
        '422': { description: Invalid role, username, or password policy }
        '503': { description: Users schema or database identity is unavailable }
  /api/users/{id}:
    get:
      summary: Read one user account
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { description: User account without password hash }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '404': { description: User not found }
        '503': { description: Users schema or database identity is unavailable }
    put:
      summary: Update a user account
      description: Username, role, name, and active status changes require an auditable reason. Username is the mutable login identifier; stable feature relationships continue to use users.id. Linked student accounts may use committee roles, but cannot use the Teacher role; student-owned name/status invariants remain enforced. The backend commits the update and one redacted audit event through update_user_account_atomic; an effective no-op is safe to retry.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200': { description: Updated user account }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '404': { description: User not found }
        '409': { description: Username already exists, or a linked-student/lifecycle invariant prevents the change }
        '422': { description: Invalid update or missing change reason }
        '503': { description: Users schema (including migration 041) or database identity is unavailable }
    delete:
      summary: Delete an unlinked user account
      description: Deletion is blocked for the current account and any account linked to a student; use inactive/alumni lifecycle changes for linked accounts.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ChangeReason'
      responses:
        '200': { description: User account deleted }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '404': { description: User not found }
        '409': { description: Self-delete or linked-student invariant prevents deletion }
        '422': { description: Missing change reason }
        '503': { description: Users schema or database identity is unavailable }
  /api/users/{id}/reset-password:
    post:
      summary: Reset a user password
      description: Teacher-only atomic reset. The password is generated once per idempotency key, auth_version is rotated, the account is marked for first login, and the plaintext temporary password is returned only in this response. The reset endpoint deliberately bypasses the generic response cache.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ChangeReason'
        - name: X-Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResetPasswordRequest'
      responses:
        '200':
          description: Password reset with a one-time temporary password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResetPasswordResponse'
        '400': { description: Missing or malformed idempotency key }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '404': { description: User not found }
        '409': { description: Self-reset is forbidden or the idempotency key was already consumed }
        '422': { description: Missing change reason }
        '503': { description: Users schema or database identity is unavailable }
  /api/options/kelas:
    get:
      security: []
      summary: List active class options
      description: Public read-only class options used by student and attendance forms. Only active classes are returned.
      responses:
        '200':
          description: Active classes ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: '#/components/schemas/ClassOption' } }
        '503': { description: Classes schema is unavailable }
  /api/admin/classes:
    get:
      summary: List classes for teacher management
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: tingkat, in: query, required: false, schema: { type: string, enum: [all, X, XI, XII] } }
        - { name: is_active, in: query, required: false, schema: { type: string, enum: [all, 'true', 'false'] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Bounded, deterministically ordered class page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - $ref: '#/components/schemas/ClassPage'
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '503': { description: Classes schema or database identity is unavailable }
    post:
      summary: Create a class master record
      parameters:
        - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreateRequest'
      responses:
        '201': { description: Class created }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '409': { description: Class name already exists }
        '422': { description: Invalid class name or level }
        '503': { description: Classes schema or database identity is unavailable }
  /api/admin/classes/{id}:
    put:
      summary: Update a class master record
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassUpdateRequest'
      responses:
        '200': { description: Class updated }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '404': { description: Class not found }
        '409': { description: Class name already exists }
        '422': { description: Invalid update or missing change reason }
        '503': { description: Classes schema or database identity is unavailable }
    delete:
      summary: Deactivate a class master record
      description: Soft-deletes the class by setting is_active=false so existing student history remains intact.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/ChangeReason'
      responses:
        '200': { description: Class deactivated }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
        '404': { description: Class not found }
        '422': { description: Missing change reason }
        '503': { description: Classes schema or database identity is unavailable }
  /api/students/options:
    get:
      summary: List bounded active-student options
      description: Teacher and treasurer searchable picker endpoint. The response never loads the complete student table into the browser.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
        - { name: active, in: query, required: false, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
      responses:
        '200': { description: Bounded student options ordered by name }
        '401': { description: Unauthenticated }
        '403': { description: Teacher or treasurer role required }
        '503': { description: Students schema is unavailable }
  /api/students:
    get:
      summary: List students with server-side filters and pagination
      description: Secretary-only management list. Search and filters are evaluated in the database and pages are capped at 100 records.
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: kelas, in: query, required: false, schema: { type: string, enum: [all, X, XI, XII] } }
        - { name: peminatan, in: query, required: false, schema: { type: string, enum: [all, kamera, editing, naskah] } }
        - { name: is_active, in: query, required: false, schema: { type: string, enum: [all, 'true', 'false'] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Paginated student records without password hashes }
        '401': { description: Unauthenticated }
        '403': { description: Secretary role required }
        '503': { description: Students schema or database identity is unavailable }
    post:
      summary: Create a student and linked member account atomically
      description: Secretary-only operation. A one-time temporary password is returned in the immediate response and is never stored in audit values.
      parameters:
        - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201': { description: Student and member account created }
        '401': { description: Unauthenticated }
        '403': { description: Secretary role required }
        '409': { description: Duplicate NIS or generated username }
        '422': { description: Invalid student profile }
        '503': { description: Students schema, provisioning function, or database identity is unavailable }
  /api/students/{id}:
    get:
      summary: Read one student by UUID or NIS
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200': { description: Student record }
        '401': { description: Unauthenticated }
        '403': { description: Ownership/capability denied }
        '404': { description: Student not found }
    put:
      summary: Update a student profile or active/alumni status
      description: Profile and lifecycle changes are intentionally separate. Status changes require the teacher capability and both operations require an auditable reason.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200': { description: Updated student record }
        '401': { description: Unauthenticated }
        '403': { description: Secretary access or teacher lifecycle capability required }
        '404': { description: Student not found }
        '422': { description: Invalid update, mixed lifecycle/profile fields, or missing change reason }
        '503': { description: Students schema or database identity is unavailable }
    delete:
      summary: Reject permanent student deletion
      description: Permanent deletion is disabled to preserve financial, attendance, and borrowing history. Use the lifecycle update with is_active=false.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/ChangeReason'
      responses:
        '409': { description: Permanent deletion is disabled }
        '401': { description: Unauthenticated }
        '403': { description: Teacher role required }
  /api/students/{id}/provision-account:
    post:
      summary: Provision a member account for a legacy student
      description: Secretary-only repair operation. The client never supplies a password; the generated temporary password is returned once.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProvisionRequest'
      responses:
        '201': { description: Member account provisioned }
        '401': { description: Unauthenticated }
        '403': { description: Secretary role required }
        '404': { description: Student not found }
        '409': { description: Student already has an account or generated username conflicts }
        '422': { description: Invalid student ID or change reason }
        '503': { description: Database, provisioning function, or database identity is unavailable }
  /api/students/{id}/dashboard-summary:
    get:
      summary: Read the legacy student dashboard summary
      description: The student may read only their own summary; teacher/leader capabilities may read another student. The current implementation uses a development fixture until a cross-domain dashboard read model is approved.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDashboardSummaryEnvelope'
        '401': { description: Unauthenticated }
        '403': { description: First-login or ownership/capability guard denied }
        '422': { description: Invalid student ID }
        '503': { description: Dashboard read model unavailable }
  /api/attendance:
    get:
      summary: List attendance with server-side filters and pagination
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: kelas, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: tanggal, in: query, required: false, schema: { type: string, format: date } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [own] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
