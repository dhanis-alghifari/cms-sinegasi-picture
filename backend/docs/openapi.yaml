  /api/film-works:
    get:
      summary: List student film works
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { description: Film catalog records with crew members }
        '401': { description: Unauthenticated }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StudentId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    AuditEntryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ClassId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKeyRequired:
      name: X-Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ChangeReason:
      name: X-Change-Reason
      in: header
      required: false
      schema: { type: string, minLength: 5, maxLength: 500 }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
    AuditActor:
      type: object
      required: [nama]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string, maxLength: 200 }
        username: { type: string, maxLength: 100 }
        role: { type: string, maxLength: 40 }
    AuditLog:
      type: object
      required: [id, action, table_name, created_at, source, changed_fields, metadata, actor]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        action: { type: string, enum: [INSERT, UPDATE, UPSERT, DELETE, SYSTEM_CHECK] }
        table_name: { type: string, minLength: 1, maxLength: 128 }
        record_id: { type: string, maxLength: 128 }
        reason: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }
        ip_address: { type: string, maxLength: 128 }
        user_agent: { type: string, maxLength: 1000 }
        source: { type: string, maxLength: 40 }
        request_id: { type: string, maxLength: 128 }
        operation_id: { type: string, maxLength: 128 }
        changed_fields:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 128 }
        old_values: { type: object, additionalProperties: true }
        new_values: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        actor: { $ref: '#/components/schemas/AuditActor' }
    AuditLogPage:
      type: object
      required: [data, total, page, pageSize, totalPages]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AuditLog' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1, maximum: 10000 }
        pageSize: { type: integer, minimum: 10, maximum: 100 }
        totalPages: { type: integer, minimum: 1 }
    OverdueCheckResult:
      type: object
      required: [checkedCount, overdueCount, notifiedCount]
      properties:
        checkedCount: { type: integer, minimum: 0 }
        overdueCount: { type: integer, minimum: 0 }
        notifiedCount: { type: integer, minimum: 0 }
    OverdueNotificationLog:
      type: object
      required: [id, borrowingId, studentName, namaAlat, dueAt, checkedAt, reason]
      properties:
        id: { type: string, maxLength: 200 }
        borrowingId: { type: string, maxLength: 128 }
        studentName: { type: string, maxLength: 200 }
        namaAlat: { type: string, maxLength: 1000 }
        dueAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time }
        reason: { type: string, maxLength: 2000 }
    UserAccount:
      type: object
      required: [id, username, nama, role, is_first_login, is_active, is_linked_student, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 3, maxLength: 30 }
        nama: { type: string, minLength: 2, maxLength: 200 }
        role: { type: string, enum: [teacher, leader, vice_leader, treasurer, secretary, equipment_team, contest_team, member] }
        is_first_login: { type: boolean }
        is_active: { type: boolean }
        is_linked_student: { type: boolean, description: True when the account is linked to a student profile }
        student_id: { type: string, nullable: true, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, nullable: true, format: date-time }
        created_by: { type: string, nullable: true, format: uuid }
        updated_by: { type: string, nullable: true, format: uuid }
        created_actor: { $ref: '#/components/schemas/ActorSummary' }
        updated_actor: { $ref: '#/components/schemas/ActorSummary' }
    UserPage:
      type: object
      required: [data, total, page, pageSize, totalPages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserAccount' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 1 }
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, nama, role, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-zA-Z0-9._-]+$' }
        nama: { type: string, minLength: 2, maxLength: 200 }
        role: { type: string, enum: [teacher, leader, vice_leader, treasurer, secretary, equipment_team, contest_team] }
        password: { type: string, minLength: 1, maxLength: 128 }
        change_reason: { type: string, maxLength: 500 }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-zA-Z0-9._-]+$' }
        nama: { type: string, minLength: 2, maxLength: 200 }
        role: { type: string, enum: [teacher, leader, vice_leader, treasurer, secretary, equipment_team, contest_team, member] }
        is_active: { type: boolean }
        change_reason: { type: string, minLength: 5, maxLength: 500 }
    UserResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        change_reason: { type: string, minLength: 5, maxLength: 500 }
        changeReason: { type: string, minLength: 5, maxLength: 500 }
    UserResetPasswordResponse:
      type: object
      required: [success, userId, temporary_password, message]
      properties:
        success: { type: boolean, example: true }
        userId: { type: string, maxLength: 128 }
        temporary_password: { type: string, minLength: 8, maxLength: 128 }
        message: { type: string, maxLength: 500 }
    ClassOption:
      type: object
      required: [id, nama_kelas, tingkat]
      properties:
        id: { type: string, format: uuid }
        nama_kelas: { type: string, minLength: 1, maxLength: 120 }
        tingkat: { type: string, enum: [X, XI, XII] }
    ClassRecord:
      type: object
      required: [id, nama_kelas, tingkat, is_active]
      properties:
        id: { type: string, format: uuid }
        nama_kelas: { type: string, minLength: 1, maxLength: 120 }
        tingkat: { type: string, enum: [X, XI, XII] }
        is_active: { type: boolean }
        created_at: { type: string, nullable: true, format: date-time }
        created_by: { type: string, nullable: true, format: uuid }
        updated_at: { type: string, nullable: true, format: date-time }
        updated_by: { type: string, nullable: true, format: uuid }
        created_actor: { $ref: '#/components/schemas/ActorSummary' }
        updated_actor: { $ref: '#/components/schemas/ActorSummary' }
    ActorSummary:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        nama: { type: string, maxLength: 200 }
        username: { type: string, maxLength: 100 }
        role: { type: string, maxLength: 40 }
        is_active: { type: boolean }
    ClassPage:
      type: object
      required: [data, total, page, pageSize, totalPages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ClassRecord' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 1 }
    ClassCreateRequest:
      type: object
      additionalProperties: false
      required: [nama_kelas, tingkat]
      properties:
        nama_kelas: { type: string, minLength: 1, maxLength: 120 }
        tingkat: { type: string, enum: [X, XI, XII] }
    ClassUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nama_kelas: { type: string, minLength: 1, maxLength: 120 }
        tingkat: { type: string, enum: [X, XI, XII] }
        is_active: { type: boolean }
        change_reason: { type: string, minLength: 5, maxLength: 500 }
    StudentRecord:
      type: object
      required: [id, nis, nama, kelas, is_active, created_at]
      properties:
        id: { type: string, maxLength: 128 }
        user_id: { type: string, nullable: true, format: uuid }
        nis: { type: string, minLength: 1, maxLength: 40 }
        nama: { type: string, minLength: 2, maxLength: 120 }
        kelas: { type: string, minLength: 1, maxLength: 80 }
        peminatan: { type: string, nullable: true, enum: [kamera, editing, naskah] }
        no_telepon: { type: string, nullable: true, maxLength: 40 }
        foto_url: { type: string, nullable: true, maxLength: 2000000 }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, nullable: true, format: date-time }
        created_by: { type: string, nullable: true, format: uuid }
        updated_by: { type: string, nullable: true, format: uuid }
        created_actor: { $ref: '#/components/schemas/ActorSummary' }
        updated_actor: { $ref: '#/components/schemas/ActorSummary' }
    StudentOption:
      type: object
      required: [id, nis, nama, kelas, label, secondaryLabel]
      properties:
        id: { type: string, maxLength: 128 }
        nis: { type: string, maxLength: 40 }
        nama: { type: string, maxLength: 120 }
        kelas: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 120 }
        secondaryLabel: { type: string, maxLength: 128 }
    StudentPage:
      type: object
      required: [data, total, page, pageSize, totalPages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StudentRecord' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 1 }
    StudentCreateRequest:
      type: object
      additionalProperties: false
      required: [nis, nama, kelas]
      properties:
        nis: { type: string, minLength: 1, maxLength: 40 }
        nama: { type: string, minLength: 2, maxLength: 120 }
        kelas: { type: string, minLength: 1, maxLength: 80 }
        peminatan: { type: string, enum: [kamera, editing, naskah] }
        no_telepon: { type: string, maxLength: 40 }
        foto_url: { type: string, maxLength: 2000000 }
        role:
          type: string
          enum: [leader, vice_leader, treasurer, secretary, equipment_team, contest_team, member]
          description: Peran akun siswa. Teacher hanya dapat dipakai akun yang tidak terhubung ke siswa.
        change_reason: { type: string, maxLength: 500 }
    StudentUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nama: { type: string, minLength: 2, maxLength: 120 }
        kelas: { type: string, minLength: 1, maxLength: 80 }
        peminatan: { type: string, enum: [kamera, editing, naskah] }
        no_telepon: { type: string, maxLength: 40 }
        foto_url: { type: string, maxLength: 2000000 }
        is_active: { type: boolean }
        change_reason: { type: string, minLength: 5, maxLength: 500 }
    StudentProvisionRequest:
      type: object
      additionalProperties: false
      properties:
        change_reason: { type: string, minLength: 5, maxLength: 500 }
    StudentDashboardSummaryEnvelope:
      type: object
      required: [success, studentId, profile, attendance, cash, grades, activeBorrowings, contestTasks]
      properties:
        success: { type: boolean, example: true }
        studentId: { type: string, maxLength: 128 }
        profile:
          type: object
          required: [nama, nisn, kelas, jurusan, fotoUrl, waliKelas]
          properties:
            nama: { type: string, maxLength: 200 }
            nisn: { type: string, maxLength: 40 }
            kelas: { type: string, maxLength: 80 }
            jurusan: { type: string, maxLength: 160 }
            fotoUrl: { type: string, maxLength: 2048, format: uri }
            waliKelas: { type: string, maxLength: 200 }
        attendance:
          type: object
          required: [persentase, hadir, sakit, izin, alpha]
          properties:
            persentase: { type: number, minimum: 0, maximum: 100 }
            hadir: { type: integer, minimum: 0 }
            sakit: { type: integer, minimum: 0 }
            izin: { type: integer, minimum: 0 }
            alpha: { type: integer, minimum: 0 }
        cash:
          type: object
          required: [totalTunggakan, statusPembayaranTerakhir, riwayat]
          properties:
            totalTunggakan: { type: number, minimum: 0 }
            statusPembayaranTerakhir: { type: string, maxLength: 200 }
            riwayat:
              type: array
              maxItems: 100
              items:
                type: object
                required: [nominal, date, status, keterangan]
                properties:
                  nominal: { type: number, minimum: 0 }
                  date: { type: string, format: date }
                  status: { type: string, maxLength: 40 }
                  keterangan: { type: string, maxLength: 500 }
        grades:
          type: object
          required: [rataRata, predikat, terakhir]
          properties:
            rataRata: { type: number, minimum: 0, maximum: 100 }
            predikat: { type: string, maxLength: 10 }
            terakhir:
              type: array
              maxItems: 100
              items:
                type: object
                required: [taskTitle, grade, category, date]
                properties:
                  taskTitle: { type: string, maxLength: 200 }
                  grade: { type: string, maxLength: 10 }
                  category: { type: string, maxLength: 40 }
                  date: { type: string, format: date }
        activeBorrowings:
          type: array
          maxItems: 100
          items:
            type: object
            required: [namaAlat, dueAt, isOverdue]
            properties:
              namaAlat: { type: string, maxLength: 200 }
              dueAt: { type: string, format: date }
              isOverdue: { type: boolean }
        contestTasks:
          type: array
          maxItems: 100
          items:
            type: object
            required: [namaContest, role, status]
            properties:
              namaContest: { type: string, maxLength: 200 }
              role: { type: string, maxLength: 120 }
              status: { type: string, maxLength: 40 }
    CashSummary:
      type: object
      required: [saldoUtama, totalPemasukan, totalPengeluaran, totalTunggakanSiswa]
      properties:
        saldoUtama: { type: number, format: double, example: 1250000 }
        totalPemasukan: { type: number, format: double, example: 1800000 }
        totalPengeluaran: { type: number, format: double, example: 550000 }
        totalTunggakanSiswa: { type: number, format: double, example: 250000 }
    CashTransactionPage:
      type: object
      required: [data, total, page, pageSize, totalPages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CashTransaction' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 1 }
    CashReport:
      type: object
      required: [period, summary, flow_breakdown, income_breakdown, expense_breakdown, daily, debts]
      properties:
        period:
          type: object
          required: [start_date, end_date, days]
          properties:
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            days: { type: integer, minimum: 1, maximum: 90 }
        summary: { type: object, additionalProperties: true }
        control: { type: object, nullable: true, additionalProperties: true }
        flow_breakdown: { type: array, items: { $ref: '#/components/schemas/CashReportBreakdown' } }
        income_breakdown: { type: array, items: { $ref: '#/components/schemas/CashReportBreakdown' } }
        expense_breakdown: { type: array, items: { $ref: '#/components/schemas/CashReportBreakdown' } }
        payment_method_breakdown: { type: array, items: { $ref: '#/components/schemas/CashReportBreakdown' } }
        daily:
          type: array
          items:
            type: object
            required: [date, income, expense]
            properties:
              date: { type: string, format: date }
              income: { type: number }
              expense: { type: number }
        debts: { type: array, items: { $ref: '#/components/schemas/CashReportDebt' } }
        income_details: { type: array, items: { type: object, additionalProperties: true } }
        expense_details: { type: array, items: { type: object, additionalProperties: true } }
    CashReportBreakdown:
      type: object
      required: [key, label, total]
      properties:
        key: { type: string }
        label: { type: string }
        total: { type: number }
        count: { type: integer, minimum: 0 }
    CashReportDebt:
      type: object
      required: [student_id, student_nama, total_debt, debt_record_count]
      properties:
        student_id: { type: string }
        student_nama: { type: string }
        nis: { type: string, nullable: true }
        kelas: { type: string, nullable: true }
        total_debt: { type: number }
        debt_record_count: { type: integer, minimum: 1 }
        oldest_debt_date: { type: string, format: date }
    CashBillingRulesUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        nominal_iuran_wajib: { type: number, minimum: 500, maximum: 9999999999.99 }
        holiday_start_date: { type: string, nullable: true, format: date }
        holiday_end_date: { type: string, nullable: true, format: date }
        skip_week: { type: boolean }
        change_reason: { type: string, minLength: 5, maxLength: 500 }
    CashDisputeCreateRequest:
      type: object
      additionalProperties: false
      required: [reason, bukti_sanggahan_url]
      oneOf:
        - required: [transaction_id]
          not: { required: [debt_record_id] }
        - required: [debt_record_id]
          not: { required: [transaction_id] }
      properties:
        transaction_id: { type: string, minLength: 1, maxLength: 64 }
        debt_record_id: { type: string, minLength: 1, maxLength: 64 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        bukti_sanggahan_url: { type: string, minLength: 1, maxLength: 900000 }
    CashDisputeQuota:
      type: object
      required: [period, period_start, limit, used, remaining, resets_at]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        period_start: { type: string, format: date }
        limit: { type: integer, minimum: 2, maximum: 2 }
        used: { type: integer, minimum: 0, maximum: 2 }
        remaining: { type: integer, minimum: 0, maximum: 2 }
        resets_at: { type: string, format: date-time }
    CashDisputeUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, review_note]
      properties:
        status: { type: string, enum: [approved, rejected, resolved] }
        review_note: { type: string, minLength: 5, maxLength: 2000 }
        resolution_date: { type: string, format: date }
        resolution_amount: { type: number, exclusiveMinimum: 0 }
        payment_method_code: { type: string, maxLength: 40 }
    CashTransaction:
      type: object
      required: [id, tipe, jumlah, tanggal, idempotency_key, created_at]
      properties:
        id: { type: string, maxLength: 64 }
        student_id: { type: string, nullable: true, maxLength: 64 }
        student_nama: { type: string, nullable: true, maxLength: 200 }
        tipe: { type: string, enum: [masuk, keluar] }
        jumlah: { type: number, format: double, minimum: 0 }
        keterangan: { type: string, nullable: true, maxLength: 500 }
        foto_bukti_url: { type: string, nullable: true, format: uri }
        tanggal: { type: string, format: date-time }
        idempotency_key: { type: string, maxLength: 128 }
        created_by: { type: string, nullable: true, maxLength: 64 }
        created_actor: { $ref: '#/components/schemas/ActorSummary' }
        created_at: { type: string, format: date-time }
        updated_by: { type: string, nullable: true, maxLength: 64 }
        updated_actor: { $ref: '#/components/schemas/ActorSummary' }
        updated_at: { type: string, nullable: true, format: date-time }
        is_billing: { type: boolean }
        metode_pembayaran: { type: string, nullable: true, maxLength: 40 }
        metode_pembayaran_label: { type: string, nullable: true, maxLength: 100 }
        dispute: { type: object, nullable: true, additionalProperties: true }
    CashPaymentMethod:
      type: object
      required: [id, code, label, is_active, sort_order]
      properties:
        id: { type: string, maxLength: 64 }
        code: { type: string, pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$', maxLength: 40 }
        label: { type: string, minLength: 1, maxLength: 80 }
        is_active: { type: boolean }
        sort_order: { type: integer, minimum: 0, maximum: 9999 }
        created_by: { type: string, nullable: true, maxLength: 64 }
        created_actor: { $ref: '#/components/schemas/ActorSummary' }
        updated_by: { type: string, nullable: true, maxLength: 64 }
        updated_actor: { $ref: '#/components/schemas/ActorSummary' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CashPaymentMethodCreateRequest:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$', minLength: 1, maxLength: 40 }
        label: { type: string, minLength: 1, maxLength: 80 }
        sort_order: { type: integer, minimum: 0, maximum: 9999 }
        change_reason: { type: string, minLength: 5, maxLength: 500 }
    CashPaymentMethodUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        sort_order: { type: integer, minimum: 0, maximum: 9999 }
        is_active: { type: boolean }
        change_reason: { type: string, minLength: 5, maxLength: 500 }
    CashInRequest:
      type: object
      additionalProperties: false
      properties:
        nominal: { type: number, minimum: 0, maximum: 9999999999.99 }
        jumlah: { type: number, minimum: 0, maximum: 9999999999.99 }
        tanggal: { type: string, format: date }
        keterangan: { type: string, maxLength: 500 }
        type: { type: string, enum: [iuran_wajib, pemasukan] }
        student_id: { type: string, maxLength: 64 }
        foto_bukti_url: { type: string, maxLength: 900000 }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
        metode_pembayaran: { type: string, nullable: true, maxLength: 40 }
    CashOutRequest:
      type: object
      additionalProperties: false
      properties:
        nominal: { type: number, exclusiveMinimum: 0, maximum: 9999999999.99 }
        jumlah: { type: number, exclusiveMinimum: 0, maximum: 9999999999.99 }
        keterangan: { type: string, minLength: 1, maxLength: 500 }
        foto_bukti_url: { type: string, maxLength: 900000 }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
        metode_pembayaran: { type: string, maxLength: 40 }
    BorrowingCreateRequest:
      type: object
      additionalProperties: false
      properties:
        student_id: { type: string, minLength: 1, maxLength: 128 }
        borrower_id: { type: string, minLength: 1, maxLength: 128 }
        equipment_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 128 }
