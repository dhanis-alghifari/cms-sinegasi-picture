services:
  api-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinegasi-api-dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    ports:
      - "127.0.0.1:3001:5001"
    env_file:
      - ./backend/.env.development
    environment:
      - NODE_ENV=development
      - PUBLIC_DEPLOYMENT=true
      - TRUST_PROXY=1
      - NTFY_ENABLED=true
    networks:
      - caddy_net
    labels:
      caddy: sinegasi-dev.duckdns.org
      caddy.reverse_proxy: "{{upstreams 5001}}"

networks:
  caddy_net:
    external: true
