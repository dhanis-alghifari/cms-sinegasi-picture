services:
  api-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinegasi-api-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:5001"
    env_file:
      - ./backend/.env.development
    environment:
      - NODE_ENV=development
      - TRUST_PROXY=true
      - NTFY_ENABLED=true
    networks:
      - caddy_net
    labels:
      caddy: sinegasi-dev.duckdns.org
      caddy.reverse_proxy: "{{upstreams 5001}}"

networks:
  caddy_net:
    external: true
